<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Analisis Website — Baitul Qur'an Surau BMC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --green-950:#0A2818; --green-900:#0A3B1F; --green-700:#136A2F; --green-500:#1E8A44; --green-tint:#E4F1E7;
    --gold-800:#7A5E1D; --gold-600:#AE8B26; --gold-400:#C9A227; --gold-tint:#F6EDD3;
    --red-700:#9B2C1F; --red-tint:#F8E3DF;
    --ink:#20240B; --ink-soft:#5C5A47; --line:#E7E1CD; --bg:#F7F5EC; --card:#FFFFFF;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:'Plus Jakarta Sans', sans-serif; color:var(--ink); background:var(--bg); -webkit-font-smoothing:antialiased; }
  button, input, select{ font:inherit; }
  :focus-visible{ outline:3px solid var(--gold-400); outline-offset:2px; }
  .hidden{ display:none !important; }

  /* Login */
  .login-wrap{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
    background:linear-gradient(150deg, var(--green-700), var(--green-950)); }
  .login-box{ background:var(--card); width:100%; max-width:400px; border-radius:20px; padding:36px 32px; box-shadow:0 40px 80px -30px rgba(0,0,0,.5); }
  .login-box h1{ font-family:'Amiri', serif; color:var(--green-900); font-size:28px; margin:0 0 4px; }
  .login-box p{ margin:0 0 24px; color:var(--ink-soft); font-size:14px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:13px; font-weight:700; margin-bottom:6px; color:var(--ink); }
  .field input{ width:100%; padding:12px 14px; border:1.5px solid var(--line); border-radius:10px; background:#fff; }
  .field input:focus{ border-color:var(--green-500); outline:none; }
  .btn{ border:none; border-radius:10px; padding:11px 18px; font-weight:700; font-size:14px; cursor:pointer; }
  .btn-primary{ background:var(--green-700); color:#fff; }
  .btn-primary:hover{ background:var(--green-900); }
  .btn-light{ background:#fff; color:var(--green-700); border:1.5px solid var(--line); }
  .btn-light:hover{ border-color:var(--green-500); }
  .btn-block{ width:100%; padding:13px; }
  .err{ background:var(--red-tint); color:var(--red-700); padding:10px 12px; border-radius:10px; font-size:13.5px; margin-bottom:14px; }

  /* Header */
  .topbar{ background:var(--green-900); color:#fff; }
  .topbar-in{ max-width:1280px; margin:0 auto; padding:14px 24px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .topbar h1{ font-family:'Amiri', serif; font-size:22px; margin:0; flex:1; }
  .topbar h1 small{ display:block; font-family:'Plus Jakarta Sans', sans-serif; font-size:12px; font-weight:600; color:rgba(255,255,255,.65); }
  .topbar .who{ font-size:13px; color:rgba(255,255,255,.75); }
  .topbar .btn-light{ background:transparent; color:#fff; border-color:rgba(255,255,255,.35); padding:8px 14px; }

  main{ max-width:1280px; margin:0 auto; padding:24px; }

  /* Stats */
  .stats{ display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:12px; margin-bottom:20px; }
  .stat{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; text-align:left; cursor:pointer; }
  .stat:hover{ border-color:var(--green-500); }
  .stat.active{ border-color:var(--green-700); box-shadow:inset 0 0 0 1px var(--green-700); }
  .stat b{ display:block; font-size:28px; line-height:1.1; font-variant-numeric:tabular-nums; }
  .stat span{ font-size:12.5px; font-weight:600; color:var(--ink-soft); }
  .stat.s-lolos b{ color:var(--green-700); } .stat.s-gagal b{ color:var(--red-700); } .stat.s-belum b{ color:var(--gold-800); }

  /* Toolbar */
  .toolbar{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
  .toolbar input, .toolbar select{ padding:10px 12px; border:1.5px solid var(--line); border-radius:10px; background:#fff; font-size:14px; }
  .toolbar input{ flex:1; min-width:200px; }
  .toolbar .count{ font-size:13px; color:var(--ink-soft); margin-left:auto; }

  /* Table */
  .table-wrap{ background:var(--card); border:1px solid var(--line); border-radius:14px; overflow-x:auto; }
  table{ width:100%; border-collapse:collapse; font-size:14px; min-width:860px; }
  th{ text-align:left; font-size:12px; font-weight:700; color:var(--ink-soft); padding:12px 14px; border-bottom:1px solid var(--line); background:#FBFAF3; white-space:nowrap; cursor:pointer; user-select:none; }
  th[data-sort]:hover{ color:var(--green-700); }
  td{ padding:12px 14px; border-bottom:1px solid #F1ECDC; vertical-align:middle; }
  tbody tr{ cursor:pointer; }
  tbody tr:hover{ background:#FBFAF3; }
  tbody tr:last-child td{ border-bottom:none; }
  .nm{ font-weight:700; }
  .sub{ font-size:12.5px; color:var(--ink-soft); }
  .num{ font-variant-numeric:tabular-nums; font-weight:700; }
  .chip{ display:inline-block; padding:4px 10px; border-radius:99px; font-size:12px; font-weight:700; white-space:nowrap; }
  .chip.lolos{ background:var(--green-tint); color:var(--green-700); }
  .chip.gagal{ background:var(--red-tint); color:var(--red-700); }
  .chip.belum{ background:var(--gold-tint); color:var(--gold-800); }
  .empty{ padding:48px 20px; text-align:center; color:var(--ink-soft); }
  a.wa{ color:var(--green-700); font-weight:600; text-decoration:none; }
  a.wa:hover{ text-decoration:underline; }

  /* Detail panel */
  .scrim{ position:fixed; inset:0; background:rgba(10,20,10,.45); z-index:50; }
  .panel{ position:fixed; top:0; right:0; bottom:0; width:min(640px, 100%); background:var(--bg); z-index:51;
    display:flex; flex-direction:column; box-shadow:-20px 0 60px -20px rgba(0,0,0,.35); }
  .panel-head{ background:var(--card); padding:18px 22px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:flex-start; }
  .panel-head h2{ margin:0; font-family:'Amiri', serif; font-size:24px; color:var(--green-900); line-height:1.2; }
  .panel-head .sub{ margin-top:4px; }
  .panel-head .btn{ margin-left:auto; flex:0 0 auto; }
  .panel-body{ overflow-y:auto; padding:18px 22px 40px; }
  .box{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px 18px; margin-bottom:14px; }
  .box h3{ margin:0 0 12px; font-size:14px; color:var(--green-900); }
  .kv{ display:grid; grid-template-columns:140px 1fr; gap:8px 12px; font-size:14px; }
  .kv dt{ color:var(--ink-soft); } .kv dd{ margin:0; font-weight:600; word-break:break-word; }
  .score-line{ display:flex; align-items:center; gap:16px; margin-bottom:14px; }
  .score-big{ font-family:'Amiri', serif; font-size:44px; line-height:1; color:var(--green-700); }
  .score-big.gagal{ color:var(--red-700); }
  .bar-row{ display:grid; grid-template-columns:190px 1fr 56px; align-items:center; gap:10px; font-size:13px; margin-bottom:8px; }
  .bar{ height:8px; background:#EFEBDD; border-radius:99px; overflow:hidden; }
  .bar i{ display:block; height:100%; background:var(--green-500); border-radius:99px; }
  .bar i.low{ background:var(--red-700); }
  .bar-row .v{ text-align:right; font-weight:700; font-variant-numeric:tabular-nums; }
  .reason{ font-size:13px; color:var(--red-700); margin-top:6px; }
  .ans{ border-top:1px solid #F1ECDC; padding:10px 0; font-size:13.5px; }
  .ans:first-of-type{ border-top:none; }
  .ans .q{ color:var(--ink-soft); }
  .ans .a{ display:flex; justify-content:space-between; gap:12px; margin-top:4px; font-weight:600; }
  .pt{ flex:0 0 auto; font-size:12px; font-weight:800; padding:2px 8px; border-radius:6px; background:var(--green-tint); color:var(--green-700); }
  .pt.p3{ background:var(--gold-tint); color:var(--gold-800); } .pt.p1,.pt.p0{ background:var(--red-tint); color:var(--red-700); }
  .aspek-label{ font-size:11.5px; font-weight:800; color:var(--gold-800); margin:14px 0 2px; }

  .chip.video{ background:#EAF0FA; color:#2B4C7E; }
  .chip.nilai{ background:#FFF1C9; color:#8A5A00; box-shadow:inset 0 0 0 1px #E8C25A; }
  .chip.bacaLolos{ background:var(--green-700); color:#fff; }
  .chip.bacaGagal{ background:var(--red-tint); color:var(--red-700); }
  .stat.s-nilai b{ color:#8A5A00; } .stat.s-video b{ color:#2B4C7E; } .stat.s-bacaLolos b{ color:var(--green-700); }
  .video-frame{ position:relative; aspect-ratio:16 / 9; background:#000; border-radius:10px; overflow:hidden; margin-bottom:10px; }
  .video-frame iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; }
  .row-btns{ display:flex; gap:8px; flex-wrap:wrap; }
  .btn-sm{ padding:8px 12px; font-size:13px; }
  .btn-lolos{ background:var(--green-700); color:#fff; } .btn-lolos:hover{ background:var(--green-900); }
  .btn-gagal{ background:#fff; color:var(--red-700); border:1.5px solid #E7B9B1; } .btn-gagal:hover{ background:var(--red-tint); }
  .btn-wa{ background:#1BA853; color:#fff; } .btn-wa:hover{ background:#168a44; }
  .btn-mail{ background:#fff; color:var(--green-700); border:1.5px solid var(--line); }
  a.btn{ display:inline-block; text-decoration:none; }
  textarea.note{ width:100%; min-height:70px; padding:10px 12px; border:1.5px solid var(--line); border-radius:10px; font:inherit; font-size:14px; margin:6px 0 10px; resize:vertical; }
  textarea.note:focus{ outline:none; border-color:var(--green-500); }
  .decision{ padding:12px 14px; border-radius:12px; margin-bottom:12px; font-size:14px; }
  .decision.lolos{ background:var(--green-tint); } .decision.gagal{ background:var(--red-tint); }
  .decision b{ display:block; font-size:15px; margin-bottom:2px; }
  .notif-title{ font-size:13px; font-weight:700; margin:14px 0 8px; color:var(--ink); }
  .notif-log{ font-size:12.5px; color:var(--ink-soft); margin-top:8px; }
  .loading{ padding:60px 20px; text-align:center; color:var(--ink-soft); }
  @media(max-width:560px){
    main{ padding:16px; } .stats{ grid-template-columns:repeat(2, 1fr); }
    .kv{ grid-template-columns:1fr; gap:2px; } .kv dd{ margin-bottom:8px; }
    .bar-row{ grid-template-columns:1fr 50px; } .bar-row .bar{ grid-column:1 / -1; grid-row:2; }
  }
  /* ---------- Tabs & Statistik ---------- */
  .tabs{ background:var(--green-900); }
  .tabs-in{ max-width:1280px; margin:0 auto; padding:0 24px; display:flex; gap:4px; }
  .tab{ background:none; border:none; color:rgba(255,255,255,.7); padding:12px 16px; font-weight:700; font-size:14px; cursor:pointer; border-bottom:3px solid transparent; }
  .tab:hover{ color:#fff; }
  .tab.active{ color:#fff; border-bottom-color:var(--gold-400); }
  .seg{ display:inline-flex; background:#fff; border:1.5px solid var(--line); border-radius:10px; padding:3px; gap:2px; flex-wrap:wrap; }
  .seg button{ border:none; background:none; padding:8px 12px; border-radius:7px; font-size:13.5px; font-weight:600; color:var(--ink-soft); cursor:pointer; }
  .seg button.on{ background:var(--green-700); color:#fff; }
  .kpis{ display:grid; grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); gap:12px; margin:16px 0; }
  .kpi{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; }
  .kpi b{ display:block; font-size:30px; line-height:1.1; font-variant-numeric:tabular-nums; color:var(--green-900); }
  .kpi span{ font-size:12.5px; font-weight:600; color:var(--ink-soft); }
  .kpi small{ display:block; font-size:12px; color:var(--ink-soft); margin-top:4px; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .chart svg{ width:100%; height:auto; display:block; }
  .legend{ display:flex; gap:16px; font-size:12.5px; color:var(--ink-soft); margin-top:8px; flex-wrap:wrap; }
  .legend i{ display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align:-1px; }
  .hbar{ display:grid; grid-template-columns:minmax(120px, 190px) 1fr 44px; align-items:center; gap:10px; font-size:13.5px; margin-bottom:9px; }
  .hbar .bar{ height:10px; } .hbar .v{ text-align:right; font-weight:700; font-variant-numeric:tabular-nums; }
  .funnel-step{ display:grid; grid-template-columns:minmax(150px, 220px) 1fr 80px; gap:10px; align-items:center; margin-bottom:8px; font-size:13.5px; }
  .funnel-step .bar{ height:22px; border-radius:6px; }
  .funnel-step .bar i{ border-radius:6px; }
  .funnel-step .v{ text-align:right; font-weight:700; font-variant-numeric:tabular-nums; }
  .funnel-step .v small{ display:block; font-weight:600; color:var(--ink-soft); font-size:11.5px; }
  .muted-note{ font-size:12.5px; color:var(--ink-soft); line-height:1.6; margin:10px 0 0; }
  .empty-card{ background:var(--card); border:1px dashed var(--line); border-radius:14px; padding:28px; text-align:center; color:var(--ink-soft); font-size:14px; }
  @media(max-width:860px){ .grid2{ grid-template-columns:1fr; } }
  @media(max-width:560px){ .funnel-step{ grid-template-columns:1fr 80px; } .funnel-step .bar{ grid-column:1 / -1; grid-row:2; } .hbar{ grid-template-columns:1fr 44px; } .hbar .bar{ grid-column:1 / -1; grid-row:2; } }
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-wrap" id="loginView">
  <form class="login-box" id="loginForm">
    <h1>Analisis Website</h1>
    <p>Baitul Qur'an Surau BMC — khusus admin</p>
    <div class="err hidden" id="loginErr"></div>
    <div class="field"><label for="email">Email admin</label><input type="email" id="email" autocomplete="username" required></div>
    <div class="field"><label for="pass">Password</label><input type="password" id="pass" autocomplete="current-password" required></div>
    <button class="btn btn-primary btn-block" type="submit" id="loginBtn">Masuk</button>
  </form>
</div>

<!-- DASHBOARD -->
<div id="appView" class="hidden">
  <header class="topbar"><div class="topbar-in">
    <h1>Analisis Website<small>Baitul Qur'an Surau BMC</small></h1>
    <span class="who" id="who"></span>
    <button class="btn btn-light" id="refreshBtn" type="button">Muat Ulang</button>
    <button class="btn btn-light" id="logoutBtn" type="button">Keluar</button>
  </div></header>
  <nav class="tabs" aria-label="Menu admin"><div class="tabs-in">
    <button type="button" class="tab active" data-tab="viewData">Data Pendaftar</button>
    <button type="button" class="tab" data-tab="viewStat">Statistik</button>
  </div></nav>

  <main id="viewData">
    <div class="stats" id="stats"></div>
    <div class="toolbar">
      <input type="search" id="q" placeholder="Cari nama, nomor HP, email, atau ID…" aria-label="Cari pendaftar">
      <select id="fJalur" aria-label="Filter jalur"><option value="">Semua jalur</option><option>Beasiswa</option><option>Mandiri</option></select>
      <button class="btn btn-light" id="csvBtn" type="button">Unduh Excel (CSV)</button>
      <span class="count" id="count"></span>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th data-sort="tgl">Tanggal daftar</th>
          <th data-sort="nama">Nama</th>
          <th data-sort="jalur">Jalur</th>
          <th data-sort="hafalan">Hafalan</th>
          <th>No. HP</th>
          <th data-sort="skor">Nilai</th>
          <th data-sort="status">Tahap saat ini</th>
        </tr></thead>
        <tbody id="tbody"><tr><td colspan="7" class="loading">Memuat data…</td></tr></tbody>
      </table>
    </div>
  </main>
  <main id="viewStat" class="hidden">
    <div class="toolbar">
      <div class="seg" id="segLembaga" role="group" aria-label="Pilih lembaga">
        <button type="button" class="on" data-l="semua">Semua</button>
        <button type="button" data-l="lq">Pondok Lumbung Qur'an</button>
        <button type="button" data-l="rq">Rumah Qur'an Syamil Madani</button>
      </div>
      <div class="seg" id="segHari" role="group" aria-label="Pilih periode">
        <button type="button" data-h="7">7 hari</button>
        <button type="button" class="on" data-h="30">30 hari</button>
        <button type="button" data-h="90">90 hari</button>
      </div>
    </div>
    <div id="statBody"><div class="loading">Memuat statistik…</div></div>
  </main>
</div>

<div class="scrim hidden" id="scrim"></div>
<aside class="panel hidden" id="panel" role="dialog" aria-modal="true" aria-labelledby="pName">
  <div class="panel-head">
    <div><h2 id="pName"></h2><div class="sub" id="pSub"></div></div>
    <button class="btn btn-light" type="button" id="closePanel">Tutup</button>
  </div>
  <div class="panel-body" id="pBody"></div>
</aside>

  }
  var LABEL = { belum:'Belum tes awal', gagal:'Tidak lolos tes awal', video:'Menunggu video', nilai:'Perlu dinilai',
    bacaLolos:'Lolos tes baca', bacaGagal:'Tidak lolos tes baca' };

  // ---------- Login ----------
  $('loginForm').addEventListener('submit', function(e){
    e.preventDefault();
    $('loginErr').classList.add('hidden'); $('loginBtn').disabled = true; $('loginBtn').textContent = 'Memeriksa…';
    auth.signInWithEmailAndPassword($('email').value.trim(), $('pass').value).catch(function(err){
      var m = 'Email atau password salah.';
      if(err.code === 'auth/too-many-requests') m = 'Terlalu banyak percobaan. Coba lagi beberapa menit lagi.';
      if(err.code === 'auth/network-request-failed') m = 'Tidak ada koneksi internet.';
      if(err.code === 'auth/operation-not-allowed') m = 'Login email/password belum diaktifkan di Firebase (Authentication → Sign-in method → Email/Password).';
      if(err.code === 'auth/user-disabled') m = 'Akun ini dinonaktifkan di Firebase.';
      if(err.code === 'auth/invalid-email') m = 'Format email tidak valid.';
      console.warn('Login gagal:', err.code, err.message);
      $('loginErr').textContent = m; $('loginErr').classList.remove('hidden');
    }).then(function(){ $('loginBtn').disabled = false; $('loginBtn').textContent = 'Masuk'; });
  });
  $('logoutBtn').addEventListener('click', function(){ auth.signOut(); });
  $('refreshBtn').addEventListener('click', function(){ load(); if(statDocs !== null) loadStat(); });

  auth.onAuthStateChanged(function(user){
    $('loginView').classList.toggle('hidden', !!user);
    $('appView').classList.toggle('hidden', !user);
    if(user){ $('who').textContent = user.email; load(); }
  });

  // ---------- Data ----------
  function load(){
    $('tbody').innerHTML = '<tr><td colspan="7" class="loading">Memuat data…</td></tr>';
    var cadangan = db.collection('hasil_tes_seleksi').get().catch(function(){ return null; });
    var videoCadangan = db.collection('video_tes_baca').get().catch(function(){ return null; });
    Promise.all([db.collection('pendaftaran').get(), cadangan, videoCadangan]).then(function(res){
      var extra = {}, vid = {};
      if(res[1]) res[1].forEach(function(d){ var x = d.data(); if(x.pendaftaranId) extra[x.pendaftaranId] = x; });
      if(res[2]) res[2].forEach(function(d){ var x = d.data(); if(x.pendaftaranId) vid[x.pendaftaranId] = x; });
      rows = [];
      res[0].forEach(function(d){
        var x = d.data();
        var baca = x.tesBaca || (vid[d.id] ? { videoUrl: vid[d.id].videoUrl, dikirimPada: vid[d.id].dikirimPada, status:'menunggu_penilaian' } : null);
        rows.push({ id:d.id, data:x, tes: x.tesSeleksi || extra[d.id] || null, baca: baca, tgl: toDate(x.createdAt) });
      });
      render();
      if(openId) openDetail(openId);
      if(statDocs !== null) renderStat();
    }).catch(function(err){
      console.error(err);
      var msg = (err && err.code === 'permission-denied')
        ? 'Akses ditolak oleh aturan Firebase. Aturan Firestore perlu mengizinkan admin yang sudah login untuk membaca koleksi <b>pendaftaran</b>.'
        : 'Gagal memuat data: ' + esc(err && err.message);
      $('tbody').innerHTML = '<tr><td colspan="7" class="empty">' + msg + '</td></tr>';
      $('stats').innerHTML = '';
    });
  }

  function filtered(){
    var q = $('q').value.trim().toLowerCase(), j = $('fJalur').value;
    return rows.filter(function(r){
      if(filterStatus && statusOf(r) !== filterStatus) return false;
      if(j && r.data.jalur !== j) return false;
      if(q){ var hay = [r.data.nama, r.data.hp, r.data.email, r.id].join(' ').toLowerCase(); if(hay.indexOf(q) === -1) return false; }
      return true;
    }).sort(function(a, b){
      var va, vb;
      if(sortKey === 'tgl'){ va = a.tgl ? a.tgl.getTime() : 0; vb = b.tgl ? b.tgl.getTime() : 0; }
      else if(sortKey === 'skor'){ va = a.tes ? a.tes.skorTotal : -1; vb = b.tes ? b.tes.skorTotal : -1; }
      else if(sortKey === 'hafalan'){ va = +a.data.hafalan || 0; vb = +b.data.hafalan || 0; }
      else if(sortKey === 'status'){ var ord = ['nilai','video','bacaLolos','bacaGagal','gagal','belum']; va = ord.indexOf(statusOf(a)); vb = ord.indexOf(statusOf(b)); }
      else { va = String(a.data[sortKey] || '').toLowerCase(); vb = String(b.data[sortKey] || '').toLowerCase(); }
      return va < vb ? -sortDir : va > vb ? sortDir : 0;
    });
  }

  function render(){
    var c = { semua:rows.length, belum:0, gagal:0, video:0, nilai:0, bacaLolos:0, bacaGagal:0 };
    rows.forEach(function(r){ c[statusOf(r)]++; });
    var defs = [['','Semua pendaftar',c.semua,''],['nilai','Video perlu dinilai',c.nilai,'s-nilai'],['video','Menunggu video',c.video,'s-video'],
      ['bacaLolos','Lolos tes baca',c.bacaLolos,'s-bacaLolos'],['bacaGagal','Tidak lolos tes baca',c.bacaGagal,'s-gagal'],
      ['gagal','Tidak lolos tes awal',c.gagal,'s-gagal'],['belum','Belum tes awal',c.belum,'s-belum']];
    $('stats').innerHTML = defs.map(function(d){
      return '<button type="button" class="stat ' + d[3] + (filterStatus === d[0] ? ' active' : '') + '" data-f="' + d[0] + '"><b>' + d[2] + '</b><span>' + d[1] + '</span></button>';
    }).join('');
    $('stats').querySelectorAll('button.stat').forEach(function(b){
      b.addEventListener('click', function(){ filterStatus = this.getAttribute('data-f'); render(); });
    });

    var list = filtered();
    $('count').textContent = list.length + ' dari ' + rows.length + ' pendaftar';
    if(!list.length){
      $('tbody').innerHTML = '<tr><td colspan="7" class="empty">' + (rows.length ? 'Tidak ada pendaftar yang cocok dengan filter.' : 'Belum ada pendaftar.') + '</td></tr>';
      return;
    }
    $('tbody').innerHTML = list.map(function(r){
      var st = statusOf(r), wa = waLink(r.data.hp);
      return '<tr data-id="' + esc(r.id) + '" tabindex="0">' +
        '<td>' + fmtTgl(r.tgl) + '</td>' +
        '<td><div class="nm">' + esc(r.data.nama || '-') + '</div><div class="sub">' + esc(r.data.umur ? r.data.umur + ' th' : '') + (r.data.provinsi ? ' · ' + esc(r.data.provinsi) : '') + '</div></td>' +
        '<td>' + esc(r.data.jalur || '-') + '</td>' +
        '<td>' + (r.data.hafalan ? esc(r.data.hafalan) + ' juz' : '-') + '</td>' +
        '<td>' + (wa ? '<a class="wa" href="' + wa + '" target="_blank" rel="noopener" onclick="event.stopPropagation()">' + esc(r.data.hp) + '</a>' : '-') + '</td>' +
        '<td class="num">' + (r.tes ? r.tes.skorTotal : '–') + '</td>' +
        '<td><span class="chip ' + st + '">' + LABEL[st] + '</span></td></tr>';
    }).join('');
    $('tbody').querySelectorAll('tr[data-id]').forEach(function(tr){
      tr.addEventListener('click', function(){ openDetail(this.getAttribute('data-id')); });
      tr.addEventListener('keydown', function(e){ if(e.key === 'Enter') openDetail(this.getAttribute('data-id')); });
    });
  }

  $('q').addEventListener('input', render);
  $('fJalur').addEventListener('change', render);
  document.querySelectorAll('th[data-sort]').forEach(function(th){
    th.addEventListener('click', function(){
      var k = this.getAttribute('data-sort');
      if(sortKey === k) sortDir = -sortDir; else { sortKey = k; sortDir = (k === 'nama' || k === 'jalur') ? 1 : -1; }
      render();
    });
  });

  // ---------- Detail ----------
  function openDetail(id){
    var r = rows.filter(function(x){ return x.id === id; })[0]; if(!r) return;
    var d = r.data, st = statusOf(r), wa = waLink(d.hp);
    $('pName').textContent = d.nama || '(tanpa nama)';
    $('pSub').innerHTML = '<span class="chip ' + st + '">' + LABEL[st] + '</span> &nbsp;ID: ' + esc(r.id);

    var html = '';
    if(r.tes){
      var t = r.tes, sa = t.skorAspek || {};
      html += '<div class="box"><h3>Hasil Tes Seleksi Awal</h3><div class="score-line"><div class="score-big' + (t.lolos ? '' : ' gagal') + '">' + t.skorTotal + '</div>' +
        '<div class="sub">dari 100 · dikerjakan ' + fmtTgl(toDate(t.selesaiPada), true) + '</div></div>';
      ASPEK.forEach(function(a){
        var v = sa[a[0]] || 0, low = a[3] && v < a[3];
        html += '<div class="bar-row"><span>' + a[1] + (a[3] ? ' <span class="sub">(min. ' + a[3] + ')</span>' : '') + '</span>' +
          '<div class="bar"><i class="' + (low ? 'low' : '') + '" style="width:' + Math.round(v / a[2] * 100) + '%"></i></div>' +
          '<span class="v">' + v + '/' + a[2] + '</span></div>';
      });
      if(t.alasanTidakLolos && t.alasanTidakLolos.length) html += '<div class="reason">Alasan tidak lolos: ' + t.alasanTidakLolos.map(esc).join('; ') + '</div>';
      html += '</div>';
    } else {
      html += '<div class="box"><h3>Hasil Tes Seleksi Awal</h3><p class="sub" style="margin:0">Pendaftar ini belum mengerjakan tes.</p></div>';
    }

    if(r.tes && r.tes.lolos) html += boxTesBaca(r);

    html += '<div class="box"><h3>Data Pendaftar</h3><dl class="kv">' + [
      ['Tanggal daftar', fmtTgl(r.tgl, true)], ['Umur', d.umur ? d.umur + ' tahun' : ''], ['Jalur', d.jalur], ['Hafalan', d.hafalan ? d.hafalan + ' juz' : ''],
      ['No. HP', d.hp ? (wa ? '<a class="wa" href="' + wa + '" target="_blank" rel="noopener">' + esc(d.hp) + ' (WhatsApp)</a>' : esc(d.hp)) : '', true],
      ['Email', d.email], ['Provinsi', d.provinsi], ['Lulusan', d.lulusan], ['Nama ayah', d.ayah], ['Nama ibu', d.ibu],
      ['Hobi', d.hobi], ['Cita-cita', d.citacita], ['Riwayat penyakit', d.penyakit], ['Alasan mendaftar', d.alasan]
    ].map(function(x){ return '<dt>' + x[0] + '</dt><dd>' + (x[2] ? x[1] : esc(x[1] || '-')) + '</dd>'; }).join('') + '</dl></div>';

    if(r.tes && r.tes.jawaban && r.tes.jawaban.length){
      html += '<div class="box"><h3>Jawaban Tes (20 soal)</h3>';
      var last = '';
      r.tes.jawaban.forEach(function(j){
        var a = ASPEK.filter(function(x){ return x[0] === j.aspek; })[0];
        if(a && a[0] !== last){ html += '<div class="aspek-label">' + a[1] + '</div>'; last = a[0]; }
        html += '<div class="ans"><div class="q">' + j.no + '. ' + esc(SOAL[j.no - 1] || '') + '</div>' +
          '<div class="a"><span>' + esc(j.jawaban) + '</span><span class="pt p' + j.poin + '">' + j.poin + ' poin</span></div></div>';
      });
      html += '</div>';
    }
    var prevScroll = (openId === r.id) ? $('pBody').scrollTop : 0;
    openId = r.id;
    $('pBody').innerHTML = html; $('pBody').scrollTop = prevScroll;
    pasangAksiTesBaca(r);
    $('panel').classList.remove('hidden'); $('scrim').classList.remove('hidden');
    document.body.style.overflow = 'hidden';
    if(!prevScroll) $('closePanel').focus();
  }
  function closeDetail(){ openId = null; $('panel').classList.add('hidden'); $('scrim').classList.add('hidden'); document.body.style.overflow = ''; }
  $('closePanel').addEventListener('click', closeDetail);
  $('scrim').addEventListener('click', closeDetail);
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeDetail(); });

  // ---------- Tes Baca Al-Qur'an ----------
  function embedUrl(url){
    var m = String(url).match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/))([\w-]{6,})/i);
    if(m) return 'https://www.youtube-nocookie.com/embed/' + m[1];
    m = String(url).match(/drive\.google\.com\/(?:file\/d\/|open\?id=)([\w-]{10,})/i);
    if(m) return 'https://drive.google.com/file/d/' + m[1] + '/preview';
    return '';
  }

  function pesanKeputusan(r){
    var d = r.data, b = r.baca || {}, nama = d.nama || 'Calon Santri';
    var catatan = b.catatan ? '\n\nCatatan penguji: ' + b.catatan : '';
    var isi = b.keputusan === 'lolos'
      ? 'Alhamdulillah, berdasarkan hasil penilaian video Tes Baca Al-Qur\'an, Anda dinyatakan *LOLOS* dan berhak melanjutkan ke tahap berikutnya, yaitu *Wawancara & Validasi*.\n\nTim kami akan segera menghubungi Anda untuk jadwal wawancara.'
      : 'Terima kasih telah mengikuti Tes Baca Al-Qur\'an. Mohon maaf, berdasarkan hasil penilaian, Anda *belum dapat melanjutkan* ke tahap berikutnya pada gelombang ini.\n\nSemoga Allah memudahkan langkah Anda dalam belajar Al-Qur\'an. Anda dapat mencoba kembali pada gelombang berikutnya.';
    var teks = 'Assalamu\'alaikum warahmatullahi wabarakatuh.\n\nYth. ' + nama + ',\n\n' + isi + catatan +
      '\n\nID Pendaftaran: ' + r.id + '\n\nWassalamu\'alaikum warahmatullahi wabarakatuh.\nPanitia Penerimaan Santri Baru\nPondok Lumbung Qur\'an';
    return { subjek: 'Hasil Tes Baca Al-Qur\'an - Pondok Lumbung Qur\'an', teks: teks };
  }

  function boxTesBaca(r){
    var b = r.baca, h = '<div class="box" id="boxBaca"><h3>Tes Baca Al-Qur\'an</h3>';
    if(!b || !b.videoUrl) return h + '<p class="sub" style="margin:0">Pendaftar sudah lolos Tes Seleksi Awal, tetapi belum mengirim link video bacaan.</p></div>';
    var em = embedUrl(b.videoUrl);
    if(em) h += '<div class="video-frame"><iframe src="' + em + '" title="Video tes baca ' + esc(r.data.nama) + '" allow="encrypted-media; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>';
    h += '<div class="row-btns" style="margin-bottom:10px"><a class="btn btn-light btn-sm" href="' + esc(b.videoUrl) + '" target="_blank" rel="noopener">Buka video di tab baru</a></div>' +
         '<p class="sub" style="margin:0 0 12px">Dikirim ' + fmtTgl(toDate(b.dikirimPada), true) + '. Jika video tidak bisa diputar, kemungkinan akses videonya belum dibuka untuk umum.</p>';
    if(b.keputusan && !r._ubah){
      var ok = b.keputusan === 'lolos';
      h += '<div class="decision ' + (ok ? 'lolos' : 'gagal') + '"><b>' + (ok ? '\u2713 Lolos Tes Baca' : '\u2715 Tidak Lolos Tes Baca') + '</b>' +
           'Dinilai oleh ' + esc(b.dinilaiOleh || '-') + ', ' + fmtTgl(toDate(b.dinilaiPada), true) +
           (b.catatan ? '<div style="margin-top:6px">Catatan: ' + esc(b.catatan) + '</div>' : '') + '</div>';
      h += '<div class="notif-title">Kirim hasil ke pendaftar</div><div class="row-btns">' +
           (waLink(r.data.hp) ? '<button type="button" class="btn btn-wa btn-sm" id="btnNotifWA">Kirim via WhatsApp</button>' : '') +
           (r.data.email ? '<button type="button" class="btn btn-mail btn-sm" id="btnNotifMail">Kirim via Gmail</button>' : '') +
           '<button type="button" class="btn btn-light btn-sm" id="btnSalin">Salin pesan</button>' +
           '<button type="button" class="btn btn-light btn-sm" id="btnUbah">Ubah keputusan</button></div>';
      var log = [];
      if(b.notifWA) log.push('WhatsApp dibuka ' + fmtTgl(toDate(b.notifWA), true));
      if(b.notifEmail) log.push('Gmail dibuka ' + fmtTgl(toDate(b.notifEmail), true));
      h += '<div class="notif-log">' + (log.length ? log.join(' \u00b7 ') : 'Notifikasi belum dikirim.') + '</div>';
    } else {
      h += '<label for="catatanBaca" style="font-size:13px;font-weight:700">Catatan penguji (opsional, ikut terkirim ke pendaftar)</label>' +
           '<textarea class="note" id="catatanBaca" placeholder="Contoh: Makharijul huruf sudah baik, perlu memperbaiki panjang-pendek bacaan.">' + esc((b && b.catatan) || '') + '</textarea>' +
           '<div class="row-btns"><button type="button" class="btn btn-lolos" id="btnLolos">Lolos Tes Baca</button>' +
           '<button type="button" class="btn btn-gagal" id="btnGagal">Tidak Lolos</button>' +
           (r._ubah ? '<button type="button" class="btn btn-light" id="btnBatalUbah">Batal</button>' : '') + '</div>';
    }
    return h + '</div>';
  }

  function simpanKeputusan(r, keputusan){
    var label = keputusan === 'lolos' ? 'LOLOS' : 'TIDAK LOLOS';
    if(!confirm('Tetapkan ' + (r.data.nama || 'pendaftar ini') + ' ' + label + ' Tes Baca Al-Qur\'an?')) return;
    var b = r.baca || {};
    var baru = { videoUrl: b.videoUrl, dikirimPada: b.dikirimPada || null, status: 'dinilai', keputusan: keputusan,
      catatan: ($('catatanBaca') ? $('catatanBaca').value.trim() : ''), dinilaiPada: new Date(),
      dinilaiOleh: (auth.currentUser && auth.currentUser.email) || '' };
    db.collection('pendaftaran').doc(r.id).update({ tesBaca: baru, status: keputusan === 'lolos' ? 'lolos_tes_baca' : 'tidak_lolos_tes_baca' })
      .then(function(){ r.baca = baru; r.data.tesBaca = baru; r._ubah = false; render(); openDetail(r.id); })
      .catch(function(e){ console.error(e); alert('Gagal menyimpan keputusan: ' + (e.message || e.code)); });
  }

  function catatNotif(r, field){
    var now = new Date(); r.baca[field] = now;
    var upd = {}; upd['tesBaca.' + field] = now;
    db.collection('pendaftaran').doc(r.id).update(upd).catch(function(e){ console.warn('Catat notifikasi gagal:', e); });
    openDetail(r.id);
  }

  function pasangAksiTesBaca(r){
    if($('btnLolos')) $('btnLolos').onclick = function(){ simpanKeputusan(r, 'lolos'); };
    if($('btnGagal')) $('btnGagal').onclick = function(){ simpanKeputusan(r, 'tidak_lolos'); };
    if($('btnUbah')) $('btnUbah').onclick = function(){ r._ubah = true; openDetail(r.id); };
    if($('btnBatalUbah')) $('btnBatalUbah').onclick = function(){ r._ubah = false; openDetail(r.id); };
    if($('btnNotifWA')) $('btnNotifWA').onclick = function(){
      window.open(waLink(r.data.hp) + '?text=' + encodeURIComponent(pesanKeputusan(r).teks), '_blank', 'noopener');
      catatNotif(r, 'notifWA');
    };
    if($('btnNotifMail')) $('btnNotifMail').onclick = function(){
      // Buka jendela tulis email Gmail (di browser) dengan penerima, subjek, dan isi yang sudah terisi
      var p = pesanKeputusan(r);
      var url = 'https://mail.google.com/mail/?view=cm&fs=1&to=' + encodeURIComponent(r.data.email) +
        '&su=' + encodeURIComponent(p.subjek) + '&body=' + encodeURIComponent(p.teks.replace(/\*/g, ''));
      window.open(url, '_blank', 'noopener');
      catatNotif(r, 'notifEmail');
    };
    if($('btnSalin')) $('btnSalin').onclick = function(){
      var b = this, teks = pesanKeputusan(r).teks.replace(/\*/g, '');
      var ok = function(){ b.textContent = 'Tersalin \u2713'; setTimeout(function(){ b.textContent = 'Salin pesan'; }, 1800); };
      if(navigator.clipboard) navigator.clipboard.writeText(teks).then(ok, function(){ prompt('Salin pesan berikut:', teks); });
      else prompt('Salin pesan berikut:', teks);
    };
  }

  // =================== STATISTIK PENGUNJUNG ===================
  var statDocs = null, statErr = null, rqRows = [], rqErr = null, statLembaga = 'semua', statHari = 30;
  var NAMA_HALAMAN = { beranda:'Beranda', kehidupan_lq:'Kehidupan Pondok LQ', gelombang_lq:'Gelombang Pendaftaran LQ',
    kehidupan_rq:'Kehidupan Rumah Qur\'an', gelombang_rq:'Gelombang Pendaftaran RQ', lainnya:'Halaman lain' };
  var HALAMAN_LEMBAGA = { lq:['kehidupan_lq','gelombang_lq'], rq:['kehidupan_rq','gelombang_rq'] };
  var NAMA_SUMBER = { langsung:'Langsung / WhatsApp', instagram:'Instagram', whatsapp:'WhatsApp (link bertanda)', facebook:'Facebook',
    tiktok:'TikTok', youtube:'YouTube', mesin_pencari:'Google / mesin pencari', lainnya:'Situs lain' };
  function tglKey(d){ return d.toLocaleDateString('en-CA', { timeZone:'Asia/Jakarta' }); }
  function nHariLalu(n){ var d = new Date(); d.setDate(d.getDate() - n); return d; }
  function fmtAngka(n){ return (n || 0).toLocaleString('id-ID'); }

  document.querySelectorAll('.tab').forEach(function(t){
    t.addEventListener('click', function(){
      document.querySelectorAll('.tab').forEach(function(x){ x.classList.toggle('active', x === t); });
      $('viewData').classList.toggle('hidden', t.getAttribute('data-tab') !== 'viewData');
      $('viewStat').classList.toggle('hidden', t.getAttribute('data-tab') !== 'viewStat');
      if(t.getAttribute('data-tab') === 'viewStat'){ if(statDocs === null) loadStat(); else renderStat(); }
    });
  });
  document.querySelectorAll('#segLembaga button').forEach(function(bt){
    bt.addEventListener('click', function(){ statLembaga = this.getAttribute('data-l');
      document.querySelectorAll('#segLembaga button').forEach(function(x){ x.classList.toggle('on', x === bt); }); renderStat(); });
  });
  document.querySelectorAll('#segHari button').forEach(function(bt){
    bt.addEventListener('click', function(){ statHari = +this.getAttribute('data-h');
      document.querySelectorAll('#segHari button').forEach(function(x){ x.classList.toggle('on', x === bt); }); renderStat(); });
  });

  function loadStat(){
    $('statBody').innerHTML = '<div class="loading">Memuat statistik…</div>';
    var mulai = tglKey(nHariLalu(89));
    var qStat = db.collection('statistik_kunjungan').where(firebase.firestore.FieldPath.documentId(), '>=', mulai).get()
      .then(function(snap){ statDocs = {}; statErr = null; snap.forEach(function(d){ statDocs[d.id] = d.data(); }); })
      .catch(function(e){ console.error(e); statDocs = {}; statErr = e; });
    var qRq = db.collection('pendaftaran_rq').get()
      .then(function(snap){ rqRows = []; rqErr = null; snap.forEach(function(d){ var x = d.data(); rqRows.push({ id:d.id, data:x, tgl:toDate(x.createdAt) }); }); })
      .catch(function(e){ rqRows = []; rqErr = e; });
    Promise.all([qStat, qRq]).then(renderStat);
  }

  function renderStat(){
    if(statDocs === null) return;
    var L = statLembaga, days = [];
    for(var i = statHari - 1; i >= 0; i--) days.push(tglKey(nHariLalu(i)));
    var start = days[0];
    function nilai(doc, path){ var o = doc; path.split('.').forEach(function(k){ o = o ? o[k] : undefined; }); return +o || 0; }
    var kunj = 0, unik = 0, hal = {}, sumber = {}, perangkat = {}, perHari = {};
    days.forEach(function(k){
      var d = statDocs[k] || {};
      var ku = L === 'semua' ? nilai(d, 'total') : nilai(d, 'lembaga.' + L);
      var un = L === 'semua' ? nilai(d, 'unik') : nilai(d, 'lembagaUnik.' + L);
      kunj += ku; unik += un; perHari[k] = { unik:un, kunj:ku, daftar:0 };
      Object.keys(d.halaman || {}).forEach(function(h){
        if(L !== 'semua' && HALAMAN_LEMBAGA[L].indexOf(h) === -1) return;
        hal[h] = (hal[h] || 0) + (+d.halaman[h] || 0);
      });
      Object.keys(d.sumber || {}).forEach(function(s){ sumber[s] = (sumber[s] || 0) + (+d.sumber[s] || 0); });
      Object.keys(d.perangkat || {}).forEach(function(s){ perangkat[s] = (perangkat[s] || 0) + (+d.perangkat[s] || 0); });
    });
    var pend = [];
    if(L !== 'rq') rows.forEach(function(r){ if(r.tgl) pend.push({ r:r, l:'lq' }); });
    if(L !== 'lq') rqRows.forEach(function(r){ if(r.tgl) pend.push({ r:r, l:'rq' }); });
    pend = pend.filter(function(p){ return tglKey(p.r.tgl) >= start; });
    pend.forEach(function(p){ var k = tglKey(p.r.tgl); if(perHari[k]) perHari[k].daftar++; });
    var konv = unik ? (pend.length / unik * 100) : 0;
    var semuaTgl = Object.keys(statDocs).sort();

    var h = '';
    if(statErr){
      h += '<div class="empty-card" style="margin-top:14px">Statistik belum bisa dibaca: ' +
        (statErr.code === 'permission-denied' ? 'aturan Firebase belum mengizinkan membaca <b>statistik_kunjungan</b>. Perbarui Rules sesuai petunjuk.' : esc(statErr.message)) + '</div>';
    }
    h += '<div class="kpis">' +
      '<div class="kpi"><b>' + fmtAngka(unik) + '</b><span>Pengunjung unik</span><small>perkiraan, per perangkat per hari</small></div>' +
      '<div class="kpi"><b>' + fmtAngka(kunj) + '</b><span>Halaman dibuka</span><small>total tampilan halaman</small></div>' +
      '<div class="kpi"><b>' + fmtAngka(pend.length) + '</b><span>Pendaftar</span><small>' + statHari + ' hari terakhir</small></div>' +
      '<div class="kpi"><b>' + (unik && !(L === 'rq' && !rqRows.length) ? konv.toFixed(1).replace('.', ',') + '%' : '–') + '</b><span>Konversi</span><small>pendaftar ÷ pengunjung unik</small></div>' +
    '</div>';

    // Grafik harian
    var maxV = 1; days.forEach(function(k){ maxV = Math.max(maxV, perHari[k].unik, perHari[k].daftar); });
    var W = 900, H = 220, pad = 28, bw = (W - pad) / days.length;
    var svg = '<svg viewBox="0 0 ' + W + ' ' + (H + 26) + '" role="img" aria-label="Grafik pengunjung dan pendaftar per hari">';
    [0, .5, 1].forEach(function(f){ var y = H - f * (H - 10); svg += '<line x1="' + pad + '" x2="' + W + '" y1="' + y + '" y2="' + y + '" stroke="#EFEBDD"/><text x="0" y="' + (y + 4) + '" font-size="11" fill="#8a8672">' + Math.round(maxV * f) + '</text>'; });
    days.forEach(function(k, i){
      var v = perHari[k], x = pad + i * bw, bh = v.unik / maxV * (H - 10);
      svg += '<rect x="' + (x + bw * .15) + '" y="' + (H - bh) + '" width="' + Math.max(1, bw * .7) + '" height="' + bh + '" rx="2" fill="#1E8A44"><title>' + k + ': ' + v.unik + ' pengunjung unik, ' + v.daftar + ' pendaftar</title></rect>';
      if(v.daftar){ var dy = H - v.daftar / maxV * (H - 10); svg += '<circle cx="' + (x + bw / 2) + '" cy="' + dy + '" r="' + Math.min(6, Math.max(3, bw * .25)) + '" fill="#C9A227" stroke="#fff" stroke-width="1.5"><title>' + k + ': ' + v.daftar + ' pendaftar</title></circle>'; }
      var step = days.length <= 7 ? 1 : days.length <= 30 ? 5 : 15;
      if(i % step === 0 || i === days.length - 1){ var p = k.split('-'); svg += '<text x="' + (x + bw / 2) + '" y="' + (H + 18) + '" font-size="11" text-anchor="middle" fill="#8a8672">' + (+p[2]) + '/' + (+p[1]) + '</text>'; }
    });
    svg += '</svg>';
    h += '<div class="box chart"><h3>Pengunjung &amp; pendaftar per hari</h3>' + svg +
      '<div class="legend"><span><i style="background:#1E8A44"></i>Pengunjung unik</span><span><i style="background:#C9A227;border-radius:50%"></i>Pendaftar</span></div></div>';

    function daftarBar(obj, nama, warna){
      var ks = Object.keys(obj).filter(function(k){ return obj[k] > 0; }).sort(function(a, b){ return obj[b] - obj[a]; });
      if(!ks.length) return '<p class="sub" style="margin:0">Belum ada data pada periode ini.</p>';
      var mx = obj[ks[0]], tot = ks.reduce(function(s, k){ return s + obj[k]; }, 0);
      return ks.map(function(k){ return '<div class="hbar"><span>' + esc(nama[k] || k) + '</span><div class="bar"><i style="width:' + Math.round(obj[k] / mx * 100) + '%;background:' + warna + '"></i></div><span class="v" title="' + Math.round(obj[k] / tot * 100) + '%">' + fmtAngka(obj[k]) + '</span></div>'; }).join('');
    }
    h += '<div class="grid2"><div class="box"><h3>Halaman paling sering dibuka</h3>' + daftarBar(hal, NAMA_HALAMAN, '#1E8A44') + '</div>' +
      '<div class="box"><h3>Asal pengunjung</h3>' + daftarBar(sumber, NAMA_SUMBER, '#AE8B26') +
      '<h3 style="margin-top:16px">Perangkat</h3>' + daftarBar(perangkat, { hp:'HP / tablet', laptop:'Laptop / komputer' }, '#2B4C7E') +
      '<p class="muted-note">Asal &amp; perangkat dihitung sekali per kunjungan, untuk seluruh website.</p></div></div>';

    // Corong seleksi per lembaga
    function corong(judul, langkah){
      var mx = Math.max(1, langkah[0][1]);
      return '<div class="box"><h3>' + judul + '</h3>' + langkah.map(function(s, i){
        var pct = i === 0 ? '' : (langkah[i - 1][1] ? Math.round(s[1] / langkah[i - 1][1] * 100) + '% lanjut' : '–');
        return '<div class="funnel-step"><span>' + s[0] + '</span><div class="bar"><i style="width:' + Math.round(s[1] / mx * 100) + '%;background:' + s[2] + '"></i></div><span class="v">' + fmtAngka(s[1]) + '<small>' + pct + '</small></span></div>';
      }).join('') + '</div>';
    }
    function unikLembaga(l){ return days.reduce(function(s, k){ return s + nilai(statDocs[k] || {}, 'lembagaUnik.' + l); }, 0); }
    if(L !== 'rq'){
      var lq = rows.filter(function(r){ return r.tgl && tglKey(r.tgl) >= start; });
      var c = function(fn){ return lq.filter(fn).length; };
      h += corong('Alur seleksi — Pondok Lumbung Qur\'an (' + statHari + ' hari)', [
        ['Pengunjung halaman LQ', unikLembaga('lq'), '#9DC3A8'],
        ['Mendaftar', lq.length, '#1E8A44'],
        ['Lolos Tes Seleksi Awal', c(function(r){ return r.tes && r.tes.lolos; }), '#136A2F'],
        ['Mengirim video Tes Baca', c(function(r){ return r.baca && r.baca.videoUrl; }), '#AE8B26'],
        ['Lolos Tes Baca', c(function(r){ return r.baca && r.baca.keputusan === 'lolos'; }), '#0A3B1F']
      ]);
    }
    if(L !== 'lq'){
      var rq = rqRows.filter(function(r){ return r.tgl && tglKey(r.tgl) >= start; });
      h += corong('Rumah Qur\'an Syamil Madani (' + statHari + ' hari)', [
        ['Pengunjung halaman RQ', unikLembaga('rq'), '#9DC3A8'],
        ['Mendaftar', rq.length, '#1E8A44']
      ]);
      if(!rqRows.length) h += '<p class="muted-note" style="margin:-6px 0 14px">Pendaftaran Rumah Qur\'an Syamil Madani belum dibuka. Jumlah pendaftar RQ akan otomatis terhitung di sini begitu formulir pendaftarannya aktif (data disimpan di koleksi <code>pendaftaran_rq</code>).</p>';
    }
    h += '<p class="muted-note">' + (semuaTgl.length ? 'Statistik kunjungan tercatat sejak ' + fmtTgl(new Date(semuaTgl[0] + 'T00:00:00')) + '. ' : 'Belum ada kunjungan yang tercatat. ') +
      'Halaman admin dan kunjungan mesin pencari (bot) tidak dihitung; angka pengunjung unik adalah perkiraan. Persentase "lanjut" dihitung dari tahap sebelumnya.</p>';
    $('statBody').innerHTML = h;
  }

  // ---------- Unduh CSV (bisa dibuka di Excel) ----------
  $('csvBtn').addEventListener('click', function(){
    var head = ['ID','Tanggal Daftar','Nama','Umur','Jalur','Hafalan (juz)','No HP','Email','Provinsi','Lulusan','Ayah','Ibu','Hobi','Cita-cita','Riwayat Penyakit','Alasan',
      'Tahap Saat Ini','Nilai Tes Awal'].concat(ASPEK.map(function(a){ return a[1]; })).concat(SOAL.map(function(_, i){ return 'Poin Soal ' + (i + 1); })).concat(['Link Video Tes Baca','Keputusan Tes Baca','Catatan Penguji','Dinilai Oleh']);
    var lines = [head].concat(filtered().map(function(r){
      var d = r.data, t = r.tes, sa = (t && t.skorAspek) || {}, jw = (t && t.jawaban) || [];
      return [r.id, fmtTgl(r.tgl, true), d.nama, d.umur, d.jalur, d.hafalan, (d.hp ? '="' + d.hp + '"' : ''), d.email, d.provinsi, d.lulusan, d.ayah, d.ibu, d.hobi, d.citacita, d.penyakit, d.alasan,
        LABEL[statusOf(r)], t ? t.skorTotal : ''].concat(ASPEK.map(function(a){ return t ? (sa[a[0]] || 0) : ''; }))
        .concat(SOAL.map(function(_, i){ var j = jw.filter(function(x){ return x.no === i + 1; })[0]; return j ? j.poin : ''; }))
        .concat([(r.baca && r.baca.videoUrl) || '', r.baca && r.baca.keputusan ? (r.baca.keputusan === 'lolos' ? 'Lolos' : 'Tidak lolos') : '', (r.baca && r.baca.catatan) || '', (r.baca && r.baca.dinilaiOleh) || '']);
    }));
    var csv = lines.map(function(l){ return l.map(function(v){ v = String(v == null ? '' : v); return /[";\n,]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(';'); }).join('\r\n');
    var blob = new Blob(['\ufeff' + csv], { type:'text/csv;charset=utf-8' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = 'data-pendaftar-LQ-' + new Date().toISOString().slice(0, 10) + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
  });
</script>
</body>
</html>
