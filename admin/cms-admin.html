<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMS Admin - Website BQ</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; color: #333; }
        
        .login-page { display: flex; justify-content: center; align-items: center; height: 100vh; background: linear-gradient(135deg, #2d5016, #1e3a0f); }
        .login-box { background: white; padding: 40px; border-radius: 8px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .login-box h1 { text-align: center; color: #2d5016; margin-bottom: 10px; font-size: 28px; }
        .login-box p { text-align: center; color: #888; margin-bottom: 30px; font-size: 14px; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
        
        .btn { width: 100%; padding: 10px; background: #2d5016; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn:hover { background: #1e3a0f; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        
        .error { background: #fee; color: #c33; padding: 10px; border-radius: 4px; margin-bottom: 15px; display: none; font-size: 13px; }
        .error.show { display: block; }
        
        .hint { background: #f0f0f0; padding: 10px; border-radius: 4px; margin-top: 15px; font-size: 12px; color: #666; }
        
        .dashboard { display: none; }
        .dashboard.show { display: block; }
        
        .header { background: #2d5016; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .header h2 { font-size: 20px; }
        .logout { padding: 8px 16px; background: #c33; color: white; border: none; border-radius: 4px; cursor: pointer; }
        
        .content { padding: 30px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .card { background: white; padding: 20px; border-radius: 6px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.1); transition: 0.2s; }
        .card:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.15); }
        .card h4 { color: #2d5016; margin-bottom: 5px; }
        .card p { color: #888; font-size: 12px; }
        
        .editor { background: white; padding: 20px; border-radius: 6px; display: none; }
        .editor.show { display: block; }
        .editor h3 { color: #2d5016; margin-bottom: 15px; }
        .editor textarea { width: 100%; height: 300px; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-family: monospace; font-size: 13px; }
        .editor-buttons { margin-top: 15px; display: flex; gap: 10px; }
        .editor-buttons button { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; }
        .save-btn { background: #2d5016; color: white; }
        .cancel-btn { background: #ddd; color: #333; }
        
        .success { background: #efe; color: #3c3; padding: 10px; border-radius: 4px; margin-bottom: 15px; display: none; }
        .success.show { display: block; }
    </style>
</head>
<body>

<!-- LOGIN -->
<div class="login-page" id="loginPage">
    <div class="login-box">
        <h1>✨ CMS Admin</h1>
        <p>Website BQ Content Management</p>
        <div class="error" id="errorMsg"></div>
        <form id="loginForm">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="emailInput" placeholder="msolikhin765@gmail.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="passInput" placeholder="Masukkan password Firebase Anda" required>
            </div>
            <button type="submit" class="btn" id="loginBtn">Login</button>
            <div class="hint">
                Gunakan email dan password Firebase Anda untuk login
            </div>
        </form>
    </div>
</div>

<!-- DASHBOARD -->
<div class="dashboard" id="dashboard">
    <div class="header">
        <h2>CMS Admin</h2>
        <div>
            <span id="userEmail" style="margin-right: 15px;"></span>
            <button class="logout" id="logoutBtn">Logout</button>
        </div>
    </div>

    <div class="content">
        <div id="pagesView">
            <h3 style="color: #2d5016; margin-bottom: 20px;">Pilih Halaman untuk Edit</h3>
            <div class="grid" id="pagesList"></div>
        </div>

        <div class="editor" id="editorView">
            <div class="success" id="successMsg">✅ Berhasil disimpan!</div>
            <h3 id="editorTitle">Edit Halaman</h3>
            <textarea id="contentArea"></textarea>
            <div class="editor-buttons">
                <button class="save-btn" id="saveBtn">Simpan</button>
                <button class="cancel-btn" id="cancelBtn">Batal</button>
            </div>
        </div>
    </div>
</div>

<!-- Firebase SDK Compat (Compatible with inline scripts) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
// Firebase Configuration
const firebaseConfig = {
    apiKey: "AIzaSyDDRyX8wGf-D5jSB0GBhp54R8kRIY7v3RA",
    authDomain: "website-baitual-quran.firebaseapp.com",
    projectId: "website-baitual-quran",
    storageBucket: "website-baitual-quran.appspot.com",
    messagingSenderId: "661903370097",
    appId: "1:661903370097:web:8f7c9e8c3d3a2b1a0c9d8e7f"
};

// Initialize Firebase
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

console.log('[FIREBASE] ✅ SDK Initialized (Compat Mode)');

const PAGES = [
    { id: 'index', title: 'Beranda' },
    { id: 'gelombang-pendaftaran', title: 'Gelombang Pendaftaran' },
    { id: 'kehidupan-pondok', title: 'Kehidupan Pondok' },
    { id: 'kehidupan-rumah-quran', title: 'Kehidupan Rumah Qur\'an' },
    { id: 'gelombang-syamil-madani', title: 'Gelombang Syamil Madani' }
];

let user = null;
let editPageId = null;

// LOGIN
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const email = document.getElementById('emailInput').value;
    const pass = document.getElementById('passInput').value;
    const btn = document.getElementById('loginBtn');
    const err = document.getElementById('errorMsg');
    
    console.log('[LOGIN] Attempting login for:', email);
    
    btn.disabled = true;
    btn.textContent = 'Loading...';
    err.classList.remove('show');
    
    try {
        const result = await auth.signInWithEmailAndPassword(email, pass);
        console.log('[AUTH] ✅ Login successful');
        user = result.user;
        showDashboard();
    } catch (error) {
        console.error('[LOGIN ERROR]:', error.code, error.message);
        let errorMsg = '❌ Email atau password salah';
        
        if (error.code === 'auth/user-not-found') {
            errorMsg = '❌ User tidak ditemukan';
        } else if (error.code === 'auth/wrong-password') {
            errorMsg = '❌ Password salah';
        } else if (error.code === 'auth/too-many-requests') {
            errorMsg = '❌ Terlalu banyak percobaan login. Coba lagi nanti.';
        } else if (error.code === 'auth/invalid-email') {
            errorMsg = '❌ Email tidak valid';
        }
        
        err.textContent = errorMsg;
        err.classList.add('show');
    } finally {
        btn.disabled = false;
        btn.textContent = 'Login';
    }
});

// LOGOUT
document.getElementById('logoutBtn').addEventListener('click', async () => {
    try {
        await auth.signOut();
        console.log('[LOGOUT] ✅ User logout');
        user = null;
        document.getElementById('loginPage').style.display = 'flex';
        document.getElementById('dashboard').classList.remove('show');
        document.getElementById('emailInput').value = '';
        document.getElementById('passInput').value = '';
    } catch (error) {
        console.error('[LOGOUT ERROR]:', error);
    }
});

// SHOW DASHBOARD
function showDashboard() {
    console.log('[DASHBOARD] ✅ Showing dashboard for:', user.email);
    document.getElementById('loginPage').style.display = 'none';
    document.getElementById('dashboard').classList.add('show');
    document.getElementById('userEmail').textContent = user.email;
    loadPages();
}

// LOAD PAGES
function loadPages() {
    console.log('[PAGES] ✅ Loading', PAGES.length, 'pages');
    const grid = document.getElementById('pagesList');
    grid.innerHTML = '';
    
    PAGES.forEach(p => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = '<h4>' + p.title + '</h4><p>Klik untuk edit</p>';
        card.style.cursor = 'pointer';
        card.onclick = () => editPage(p.id, p.title);
        grid.appendChild(card);
    });
}

// EDIT PAGE
async function editPage(pageId, title) {
    console.log('[EDIT] Opening page:', pageId);
    editPageId = pageId;
    document.getElementById('editorTitle').textContent = 'Edit: ' + title;
    document.getElementById('pagesView').style.display = 'none';
    document.getElementById('editorView').classList.add('show');
    
    const textarea = document.getElementById('contentArea');
    textarea.value = 'Loading...';
    
    try {
        const doc = await db.collection('pages').doc(pageId).get();
        
        if (doc.exists) {
            textarea.value = doc.data().content || '';
            console.log('[FIRESTORE] ✅ Content loaded, size:', textarea.value.length, 'bytes');
        } else {
            textarea.value = '';
            console.log('[FIRESTORE] ⚠️ Document not found');
        }
    } catch (error) {
        console.error('[FIRESTORE ERROR]:', error);
        textarea.value = '';
        alert('Error loading content: ' + error.message);
    }
}

// SAVE
document.getElementById('saveBtn').addEventListener('click', async () => {
    const content = document.getElementById('contentArea').value;
    const btn = document.getElementById('saveBtn');
    
    console.log('[SAVE] Saving page:', editPageId);
    
    btn.disabled = true;
    btn.textContent = 'Saving...';
    
    try {
        await db.collection('pages').doc(editPageId).set({
            content: content,
            status: 'published',
            updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
            updatedBy: user.email
        }, { merge: true });
        
        console.log('[FIRESTORE] ✅ Document saved successfully');
        document.getElementById('successMsg').classList.add('show');
        setTimeout(() => {
            document.getElementById('successMsg').classList.remove('show');
        }, 3000);
        
    } catch (error) {
        console.error('[SAVE ERROR]:', error);
        alert('Error: ' + error.message);
    } finally {
        btn.disabled = false;
        btn.textContent = 'Simpan';
    }
});

// CANCEL
document.getElementById('cancelBtn').addEventListener('click', () => {
    console.log('[CANCEL] Canceling edit');
    document.getElementById('pagesView').style.display = 'block';
    document.getElementById('editorView').classList.remove('show');
});

console.log('[APP] ✅ CMS Admin initialized - Firebase Compat SDK mode');
</script>

</body>
</html>
