<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMS Admin - Website BQ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        /* LOGIN PAGE */
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #2d5016 0%, #1e3a0f 100%);
        }

        .login-box {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            font-size: 28px;
            color: #2d5016;
            margin-bottom: 5px;
        }

        .login-header p {
            color: #888;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #333;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        input[type="email"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #2d5016;
            box-shadow: 0 0 5px rgba(45, 80, 22, 0.3);
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: #2d5016;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #1e3a0f;
        }

        .login-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .error-msg {
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 15px;
            font-size: 14px;
            display: none;
        }

        .error-msg.show {
            display: block;
        }

        /* DASHBOARD */
        .dashboard-container {
            display: none;
            min-height: 100vh;
            flex-direction: column;
        }

        .dashboard-container.show {
            display: flex;
        }

        .dashboard-header {
            background: #2d5016;
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .dashboard-header h2 {
            font-size: 24px;
        }

        .user-info {
            font-size: 14px;
            opacity: 0.9;
        }

        .logout-btn {
            padding: 10px 20px;
            background: #c33;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
        }

        .logout-btn:hover {
            background: #a00;
        }

        .main-content {
            flex: 1;
            padding: 30px;
        }

        .content-header {
            margin-bottom: 30px;
        }

        .content-header h3 {
            font-size: 20px;
            color: #2d5016;
            margin-bottom: 10px;
        }

        .pages-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .page-card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: all 0.2s;
        }

        .page-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }

        .page-card h4 {
            color: #2d5016;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .page-card p {
            color: #888;
            font-size: 12px;
        }

        .editor-section {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: none;
        }

        .editor-section.show {
            display: block;
        }

        .editor-header {
            margin-bottom: 15px;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }

        .editor-header h4 {
            color: #2d5016;
            margin-bottom: 5px;
        }

        .editor-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .save-btn, .cancel-btn {
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
        }

        .save-btn {
            background: #2d5016;
            color: white;
        }

        .save-btn:hover {
            background: #1e3a0f;
        }

        .cancel-btn {
            background: #eee;
            color: #333;
        }

        .cancel-btn:hover {
            background: #ddd;
        }

        textarea {
            width: 100%;
            min-height: 300px;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-family: monospace;
            font-size: 13px;
            margin-bottom: 15px;
        }

        .success-msg {
            background: #efe;
            color: #3c3;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 15px;
            display: none;
        }

        .success-msg.show {
            display: block;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #888;
        }
    </style>
</head>
<body>

<!-- LOGIN PAGE -->
<div class="login-container" id="loginPage">
    <div class="login-box">
        <div class="login-header">
            <h1>✨ CMS Admin</h1>
            <p>Website BQ Content Management</p>
        </div>
        <div class="error-msg" id="loginError"></div>
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Email Anda" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Password" required>
            </div>
            <button type="submit" class="login-btn" id="loginBtn">Login</button>
        </form>
    </div>
</div>

<!-- DASHBOARD -->
<div class="dashboard-container" id="dashboard">
    <div class="dashboard-header">
        <h2>CMS Admin</h2>
        <div style="display: flex; gap: 20px; align-items: center;">
            <span class="user-info" id="userEmail">-</span>
            <button class="logout-btn" id="logoutBtn">Logout</button>
        </div>
    </div>

    <div class="main-content">
        <!-- Pages List -->
        <div id="pagesView">
            <div class="content-header">
                <h3>Kelola Halaman</h3>
                <p>Pilih halaman untuk edit konten</p>
            </div>
            <div class="pages-grid" id="pagesList">
                <div class="loading">Loading...</div>
            </div>
        </div>

        <!-- Editor -->
        <div id="editorView" class="editor-section">
            <div class="success-msg" id="successMsg">✅ Berhasil disimpan!</div>
            <div class="editor-header">
                <h4 id="editorTitle">Edit Halaman</h4>
                <div class="editor-actions">
                    <button class="save-btn" id="saveBtn">Simpan</button>
                    <button class="cancel-btn" id="cancelBtn">Batal</button>
                </div>
            </div>
            <textarea id="contentEditor"></textarea>
        </div>
    </div>
</div>

<script>
// CONFIG
const FIREBASE_PROJECT = 'website-baitual-quran';
const FIREBASE_API_KEY = 'AIzaSyD1rkn_MN0s4Ou5q_nEVPyPF-H1miUCopd2E';

const PAGES = [
    { id: 'index', title: 'Beranda' },
    { id: 'gelombang-pendaftaran', title: 'Gelombang Pendaftaran' },
    { id: 'kehidupan-pondok', title: 'Kehidupan Pondok' },
    { id: 'kehidupan-rumah-quran', title: 'Kehidupan Rumah Qur\'an' },
    { id: 'gelombang-syamil-madani', title: 'Gelombang Syamil Madani' }
];

let currentUser = null;
let idToken = null;
let currentPageId = null;

// LOGIN
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const btn = document.getElementById('loginBtn');
    const error = document.getElementById('loginError');

    btn.disabled = true;
    btn.textContent = 'Loading...';
    error.classList.remove('show');

    try {
        const res = await fetch(
            `https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${FIREBASE_API_KEY}`,
            {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    email: email,
                    password: password,
                    returnSecureToken: true
                })
            }
        );

        const data = await res.json();

        if (!res.ok) {
            throw new Error(data.error?.message || 'Login gagal');
        }

        currentUser = { email: data.email, uid: data.localId };
        idToken = data.idToken;
        showDashboard();
    } catch (err) {
        error.textContent = '❌ ' + err.message;
        error.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'Login';
    }
});

// LOGOUT
document.getElementById('logoutBtn').addEventListener('click', () => {
    currentUser = null;
    idToken = null;
    showLoginPage();
});

// UI
function showLoginPage() {
    document.getElementById('loginPage').style.display = 'flex';
    document.getElementById('dashboard').classList.remove('show');
}

function showDashboard() {
    document.getElementById('loginPage').style.display = 'none';
    document.getElementById('dashboard').classList.add('show');
    document.getElementById('userEmail').textContent = currentUser.email;
    loadPages();
}

async function loadPages() {
    const grid = document.getElementById('pagesList');
    grid.innerHTML = '';

    for (const page of PAGES) {
        const card = document.createElement('div');
        card.className = 'page-card';
        card.innerHTML = `<h4>${page.title}</h4><p>Klik untuk edit</p>`;
        card.addEventListener('click', () => editPage(page.id, page.title));
        grid.appendChild(card);
    }
}

async function editPage(pageId, pageTitle) {
    currentPageId = pageId;
    document.getElementById('editorTitle').textContent = `Edit: ${pageTitle}`;
    document.getElementById('pagesView').style.display = 'none';
    document.getElementById('editorView').classList.add('show');
    document.getElementById('contentEditor').value = 'Loading...';

    try {
        const res = await fetch(
            `https://firestore.googleapis.com/v1/projects/${FIREBASE_PROJECT}/databases/(default)/documents/pages/${pageId}`,
            {
                headers: { 'Authorization': `Bearer ${idToken}` }
            }
        );

        if (res.ok) {
            const doc = await res.json();
            const content = doc.fields?.content?.stringValue || '';
            document.getElementById('contentEditor').value = content;
        } else {
            document.getElementById('contentEditor').value = '';
        }
    } catch (err) {
        console.error('Load error:', err);
        document.getElementById('contentEditor').value = '';
    }
}

document.getElementById('saveBtn').addEventListener('click', async () => {
    const content = document.getElementById('contentEditor').value;
    const btn = document.getElementById('saveBtn');
    btn.disabled = true;
    btn.textContent = 'Saving...';

    try {
        const res = await fetch(
            `https://firestore.googleapis.com/v1/projects/${FIREBASE_PROJECT}/databases/(default)/documents/pages/${currentPageId}?updateMask.fieldPaths=content`,
            {
                method: 'PATCH',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${idToken}`
                },
                body: JSON.stringify({
                    fields: {
                        content: { stringValue: content }
                    }
                })
            }
        );

        if (!res.ok) throw new Error('Save failed');

        const success = document.getElementById('successMsg');
        success.classList.add('show');
        setTimeout(() => success.classList.remove('show'), 3000);
    } catch (err) {
        alert('❌ Error: ' + err.message);
    } finally {
        btn.disabled = false;
        btn.textContent = 'Simpan';
    }
});

document.getElementById('cancelBtn').addEventListener('click', () => {
    currentPageId = null;
    document.getElementById('pagesView').style.display = 'block';
    document.getElementById('editorView').classList.remove('show');
});

// START
showLoginPage();
</script>

</body>
</html>
