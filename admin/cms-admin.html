<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMS Admin - Website BQ</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        /* ===== LOGIN PAGE ===== */
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #2d5016 0%, #1e3a0f 100%);
        }

        .login-box {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            font-size: 28px;
            color: #2d5016;
            margin-bottom: 5px;
        }

        .login-header p {
            color: #888;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #333;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input[type="email"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #2d5016;
            box-shadow: 0 0 5px rgba(45, 80, 22, 0.3);
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: #2d5016;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        .login-btn:hover {
            background: #1e3a0f;
        }

        .login-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .error-msg {
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 15px;
            font-size: 14px;
            display: none;
        }

        .error-msg.show {
            display: block;
        }

        /* ===== DASHBOARD ===== */
        .dashboard-container {
            display: none;
            min-height: 100vh;
        }

        .dashboard-container.show {
            display: flex;
        }

        .sidebar {
            width: 250px;
            background: #2d5016;
            color: white;
            padding: 20px;
            min-height: 100vh;
        }

        .sidebar-header {
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding-bottom: 20px;
        }

        .sidebar-header h2 {
            font-size: 20px;
            margin-bottom: 5px;
        }

        .sidebar-header p {
            font-size: 12px;
            opacity: 0.8;
        }

        .sidebar-menu {
            list-style: none;
        }

        .sidebar-menu li {
            margin-bottom: 10px;
        }

        .sidebar-menu button {
            width: 100%;
            background: none;
            border: none;
            color: white;
            text-align: left;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 5px;
            transition: background 0.3s;
            font-size: 14px;
        }

        .sidebar-menu button:hover {
            background: rgba(255,255,255,0.1);
        }

        .sidebar-menu button.active {
            background: rgba(255,255,255,0.2);
        }

        .logout-btn {
            width: 100%;
            margin-top: 20px;
            padding: 10px 15px;
            background: #c33;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }

        .logout-btn:hover {
            background: #a00;
        }

        .main-content {
            flex: 1;
            padding: 30px;
        }

        .content-header {
            margin-bottom: 30px;
        }

        .content-header h2 {
            font-size: 24px;
            color: #2d5016;
            margin-bottom: 5px;
        }

        .pages-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .page-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .page-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }

        .page-card h3 {
            color: #2d5016;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .page-card p {
            color: #666;
            font-size: 13px;
            line-height: 1.5;
        }

        .editor-container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: none;
        }

        .editor-container.show {
            display: block;
        }

        .editor-header {
            margin-bottom: 25px;
            border-bottom: 2px solid #eee;
            padding-bottom: 15px;
        }

        .editor-header h3 {
            color: #2d5016;
            font-size: 20px;
            margin-bottom: 5px;
        }

        .editor-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .save-btn, .cancel-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }

        .save-btn {
            background: #2d5016;
            color: white;
        }

        .save-btn:hover {
            background: #1e3a0f;
        }

        .cancel-btn {
            background: #eee;
            color: #333;
        }

        .cancel-btn:hover {
            background: #ddd;
        }

        textarea {
            width: 100%;
            min-height: 400px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-family: monospace;
            font-size: 14px;
            margin-bottom: 20px;
            resize: vertical;
        }

        .loading {
            text-align: center;
            color: #888;
            padding: 20px;
        }

        .success-msg {
            background: #efe;
            color: #3c3;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }

        .success-msg.show {
            display: block;
        }
    </style>
</head>
<body>

<!-- LOGIN PAGE -->
<div class="login-container" id="loginPage">
    <div class="login-box">
        <div class="login-header">
            <h1>✨ CMS Admin</h1>
            <p>Website BQ Content Management</p>
        </div>
        <div class="error-msg" id="loginError"></div>
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Masukkan email Anda" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Masukkan password" required>
            </div>
            <button type="submit" class="login-btn" id="loginBtn">Login</button>
        </form>
    </div>
</div>

<!-- DASHBOARD -->
<div class="dashboard-container" id="dashboard">
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>CMS Admin</h2>
            <p id="userEmail">-</p>
        </div>
        <ul class="sidebar-menu">
            <li><button class="nav-btn active" data-page="pages">📄 Kelola Halaman</button></li>
        </ul>
        <button class="logout-btn" id="logoutBtn">🚪 Logout</button>
    </div>
    <div class="main-content">
        <!-- Pages List -->
        <div id="pagesView">
            <div class="content-header">
                <h2>Kelola Halaman Website</h2>
                <p>Pilih halaman untuk edit konten</p>
            </div>
            <div class="pages-list" id="pagesList">
                <div class="loading">Loading...</div>
            </div>
        </div>

        <!-- Editor -->
        <div id="editorView" class="editor-container">
            <div class="success-msg" id="successMsg">✅ Konten berhasil disimpan!</div>
            <div class="editor-header">
                <h3 id="editorTitle">Edit Halaman</h3>
                <div class="editor-actions">
                    <button class="save-btn" id="saveBtn">💾 Simpan</button>
                    <button class="cancel-btn" id="cancelBtn">❌ Batal</button>
                </div>
            </div>
            <textarea id="contentEditor" placeholder="Masukkan konten HTML di sini..."></textarea>
        </div>
    </div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
// ===== FIREBASE CONFIG =====
const firebaseConfig = {
    apiKey: "AIzaSyDDRyX8wGf-D5jSB0GBhp54R8kRIY7v3RA",
    authDomain: "website-baitual-quran.firebaseapp.com",
    projectId: "website-baitual-quran",
    storageBucket: "website-baitual-quran.appspot.com",
    messagingSenderId: "258721850117",
    appId: "1:258721850117:web:251093e92051067eed4d6c"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// ===== PAGES DATA =====
const pages = [
    { id: 'index', title: 'Beranda', desc: 'Halaman utama website' },
    { id: 'gelombang-pendaftaran', title: 'Gelombang Pendaftaran', desc: 'Informasi pendaftaran santri' },
    { id: 'kehidupan-pondok', title: 'Kehidupan Pondok', desc: 'Cerita kehidupan di pondok' },
    { id: 'kehidupan-rumah-quran', title: 'Kehidupan Rumah Qur\'an', desc: 'Aktivitas rumah qur\'an' },
    { id: 'gelombang-syamil-madani', title: 'Gelombang Syamil Madani', desc: 'Program syamil madani' }
];

let currentUser = null;
let currentPageId = null;

// ===== LOGIN =====
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const loginBtn = document.getElementById('loginBtn');
    const errorMsg = document.getElementById('loginError');

    loginBtn.disabled = true;
    loginBtn.textContent = 'Loading...';
    errorMsg.classList.remove('show');

    try {
        const result = await auth.signInWithEmailAndPassword(email, password);
        currentUser = result.user;
        showDashboard();
    } catch (error) {
        console.error('Login error:', error);
        errorMsg.textContent = '❌ Email atau password salah!';
        errorMsg.classList.add('show');
        loginBtn.disabled = false;
        loginBtn.textContent = 'Login';
    }
});

// ===== LOGOUT =====
document.getElementById('logoutBtn').addEventListener('click', async () => {
    try {
        await auth.signOut();
        currentUser = null;
        showLoginPage();
    } catch (error) {
        console.error('Logout error:', error);
    }
});

// ===== UI FUNCTIONS =====
function showLoginPage() {
    document.getElementById('loginPage').style.display = 'flex';
    document.getElementById('dashboard').classList.remove('show');
}

function showDashboard() {
    document.getElementById('loginPage').style.display = 'none';
    document.getElementById('dashboard').classList.add('show');
    document.getElementById('userEmail').textContent = currentUser.email;
    loadPages();
}

function loadPages() {
    const pagesList = document.getElementById('pagesList');
    pagesList.innerHTML = '';

    pages.forEach(page => {
        const card = document.createElement('div');
        card.className = 'page-card';
        card.innerHTML = `
            <h3>${page.title}</h3>
            <p>${page.desc}</p>
        `;
        card.addEventListener('click', () => editPage(page.id, page.title));
        pagesList.appendChild(card);
    });
}

async function editPage(pageId, pageTitle) {
    currentPageId = pageId;
    document.getElementById('editorTitle').textContent = `Edit: ${pageTitle}`;
    document.getElementById('pagesView').style.display = 'none';
    document.getElementById('editorView').classList.add('show');
    document.getElementById('contentEditor').value = 'Loading...';

    try {
        const doc = await db.collection('pages').doc(pageId).get();
        if (doc.exists) {
            document.getElementById('contentEditor').value = doc.data().content || '';
        } else {
            document.getElementById('contentEditor').value = '';
        }
    } catch (error) {
        console.error('Load error:', error);
        document.getElementById('contentEditor').value = 'Error loading content';
    }
}

document.getElementById('saveBtn').addEventListener('click', async () => {
    const content = document.getElementById('contentEditor').value;
    const saveBtn = document.getElementById('saveBtn');
    saveBtn.disabled = true;
    saveBtn.textContent = 'Saving...';

    try {
        await db.collection('pages').doc(currentPageId).set({
            content: content,
            updatedAt: new Date()
        });
        
        const successMsg = document.getElementById('successMsg');
        successMsg.classList.add('show');
        setTimeout(() => successMsg.classList.remove('show'), 3000);
    } catch (error) {
        console.error('Save error:', error);
        alert('❌ Error saat menyimpan: ' + error.message);
    } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = '💾 Simpan';
    }
});

document.getElementById('cancelBtn').addEventListener('click', () => {
    currentPageId = null;
    document.getElementById('pagesView').style.display = 'block';
    document.getElementById('editorView').classList.remove('show');
});

// ===== AUTH STATE MONITOR =====
auth.onAuthStateChanged((user) => {
    if (user) {
        currentUser = user;
        showDashboard();
    } else {
        showLoginPage();
    }
});
</script>

</body>
</html>
