<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMS Admin - Website BQ</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; color: #333; }
        
        .login-page { display: flex; justify-content: center; align-items: center; height: 100vh; background: linear-gradient(135deg, #2d5016, #1e3a0f); }
        .login-box { background: white; padding: 40px; border-radius: 8px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .login-box h1 { text-align: center; color: #2d5016; margin-bottom: 10px; font-size: 28px; }
        .login-box p { text-align: center; color: #888; margin-bottom: 30px; font-size: 14px; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
        
        .btn { width: 100%; padding: 10px; background: #2d5016; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn:hover { background: #1e3a0f; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        
        .error { background: #fee; color: #c33; padding: 10px; border-radius: 4px; margin-bottom: 15px; display: none; font-size: 13px; }
        .error.show { display: block; }
        
        .dashboard { display: none; }
        .dashboard.show { display: block; }
        
        .header { background: #2d5016; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .header h2 { font-size: 20px; }
        .logout { padding: 8px 16px; background: #c33; color: white; border: none; border-radius: 4px; cursor: pointer; }
        
        .content { padding: 30px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .card { background: white; padding: 20px; border-radius: 6px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.1); transition: 0.2s; }
        .card:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.15); }
        .card h4 { color: #2d5016; margin-bottom: 5px; }
        .card p { color: #888; font-size: 12px; }
        
        .editor { background: white; padding: 20px; border-radius: 6px; display: none; }
        .editor.show { display: block; }
        .editor h3 { color: #2d5016; margin-bottom: 15px; }
        .editor textarea { width: 100%; height: 300px; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-family: monospace; font-size: 13px; }
        .editor-buttons { margin-top: 15px; display: flex; gap: 10px; }
        .editor-buttons button { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; }
        .save-btn { background: #2d5016; color: white; }
        .cancel-btn { background: #ddd; color: #333; }
        
        .success { background: #efe; color: #3c3; padding: 10px; border-radius: 4px; margin-bottom: 15px; display: none; }
        .success.show { display: block; }
    </style>
</head>
<body>

<!-- LOGIN -->
<div class="login-page" id="loginPage">
    <div class="login-box">
        <h1>✨ CMS Admin</h1>
        <p>Website BQ Content Management</p>
        <div class="error" id="errorMsg"></div>
        <form id="loginForm">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="emailInput" placeholder="msolikhin765@gmail.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="passInput" placeholder="Password Firebase" required>
            </div>
            <button type="submit" class="btn" id="loginBtn">Login</button>
        </form>
    </div>
</div>

<!-- DASHBOARD -->
<div class="dashboard" id="dashboard">
    <div class="header">
        <h2>CMS Admin</h2>
        <div>
            <span id="userEmail" style="margin-right: 15px;"></span>
            <button class="logout" id="logoutBtn">Logout</button>
        </div>
    </div>

    <div class="content">
        <div id="pagesView">
            <h3 style="color: #2d5016; margin-bottom: 20px;">Pilih Halaman untuk Edit</h3>
            <div class="grid" id="pagesList"></div>
        </div>

        <div class="editor" id="editorView">
            <div class="success" id="successMsg">✅ Berhasil disimpan!</div>
            <h3 id="editorTitle">Edit Halaman</h3>
            <textarea id="contentArea"></textarea>
            <div class="editor-buttons">
                <button class="save-btn" id="saveBtn">Simpan</button>
                <button class="cancel-btn" id="cancelBtn">Batal</button>
            </div>
        </div>
    </div>
</div>

<script>
const API_KEY = 'AIzaSyD1rkn_MN0s4Ou5q_nEVPyPF-H1miUCopd2E';
const PROJECT = 'website-baitual-quran';

const PAGES = [
    { id: 'index', title: 'Beranda' },
    { id: 'gelombang-pendaftaran', title: 'Gelombang Pendaftaran' },
    { id: 'kehidupan-pondok', title: 'Kehidupan Pondok' },
    { id: 'kehidupan-rumah-quran', title: 'Kehidupan Rumah Qur\'an' },
    { id: 'gelombang-syamil-madani', title: 'Gelombang Syamil Madani' }
];

let user = null;
let token = null;
let editPageId = null;

// LOGIN
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const email = document.getElementById('emailInput').value;
    const pass = document.getElementById('passInput').value;
    const btn = document.getElementById('loginBtn');
    const err = document.getElementById('errorMsg');
    
    btn.disabled = true;
    btn.textContent = 'Loading...';
    err.classList.remove('show');
    
    try {
        const res = await fetch(
            `https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${API_KEY}`,
            {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password: pass, returnSecureToken: true })
            }
        );
        
        const data = await res.json();
        
        if (data.error) {
            throw new Error(data.error.message);
        }
        
        user = { email: data.email };
        token = data.idToken;
        showDashboard();
        
    } catch (e) {
        err.textContent = '❌ ' + e.message;
        err.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'Login';
    }
});

// LOGOUT
document.getElementById('logoutBtn').addEventListener('click', () => {
    user = null;
    token = null;
    document.getElementById('loginPage').style.display = 'flex';
    document.getElementById('dashboard').classList.remove('show');
});

// SHOW DASHBOARD
function showDashboard() {
    document.getElementById('loginPage').style.display = 'none';
    document.getElementById('dashboard').classList.add('show');
    document.getElementById('userEmail').textContent = user.email;
    loadPages();
}

// LOAD PAGES
function loadPages() {
    const grid = document.getElementById('pagesList');
    grid.innerHTML = '';
    
    PAGES.forEach(p => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `<h4>${p.title}</h4><p>Klik untuk edit</p>`;
        card.onclick = () => editPage(p.id, p.title);
        grid.appendChild(card);
    });
}

// EDIT PAGE
async function editPage(pageId, title) {
    editPageId = pageId;
    document.getElementById('editorTitle').textContent = 'Edit: ' + title;
    document.getElementById('pagesView').style.display = 'none';
    document.getElementById('editorView').classList.add('show');
    
    const textarea = document.getElementById('contentArea');
    textarea.value = 'Loading...';
    
    try {
        const res = await fetch(
            `https://firestore.googleapis.com/v1/projects/${PROJECT}/databases/(default)/documents/pages/${pageId}`,
            { headers: { 'Authorization': `Bearer ${token}` } }
        );
        
        if (res.ok) {
            const doc = await res.json();
            textarea.value = doc.fields?.content?.stringValue || '';
        } else {
            textarea.value = '';
        }
    } catch (e) {
        textarea.value = '(Error: ' + e.message + ')';
    }
}

// SAVE
document.getElementById('saveBtn').addEventListener('click', async () => {
    const content = document.getElementById('contentArea').value;
    const btn = document.getElementById('saveBtn');
    
    btn.disabled = true;
    btn.textContent = 'Saving...';
    
    try {
        const res = await fetch(
            `https://firestore.googleapis.com/v1/projects/${PROJECT}/databases/(default)/documents/pages/${editPageId}?updateMask.fieldPaths=content`,
            {
                method: 'PATCH',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ fields: { content: { stringValue: content } } })
            }
        );
        
        if (!res.ok) throw new Error('Save failed');
        
        document.getElementById('successMsg').classList.add('show');
        setTimeout(() => document.getElementById('successMsg').classList.remove('show'), 3000);
        
    } catch (e) {
        alert('Error: ' + e.message);
    } finally {
        btn.disabled = false;
        btn.textContent = 'Simpan';
    }
});

// CANCEL
document.getElementById('cancelBtn').addEventListener('click', () => {
    document.getElementById('pagesView').style.display = 'block';
    document.getElementById('editorView').classList.remove('show');
});
</script>

</body>
</html>
